name: Build Mac Apple Silicon

on:
  workflow_dispatch:  # Manual trigger from GitHub Actions tab

jobs:
  build-mac-arm:
    runs-on: macos-latest  # GitHub's latest Mac runner uses Apple Silicon (M1)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyMuPDF python-docx pyinstaller

      - name: Build Mac Apple Silicon binary
        run: |
          python -m PyInstaller --onefile --clean --name MedPrivacy-AppleSilicon medprivacy_ui.py

      - name: Create DMG
        run: |
          mkdir -p MedPrivacy_DMG
          cp dist/MedPrivacy-AppleSilicon MedPrivacy_DMG/
          hdiutil create -volname "MedPrivacy" -srcfolder MedPrivacy_DMG -ov -format UDZO MedPrivacy-AppleSilicon.dmg

      - name: Zip DMG
        run: |
          zip MedPrivacy-Mac-AppleSilicon.zip MedPrivacy-AppleSilicon.dmg

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: MedPrivacy-Mac-AppleSilicon.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
